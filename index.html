<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ABIM Study Tracker</title>
<style>
:root {
  --bg:#f4f6f8; --surface:#fff; --fg:#1b2530; --muted:#5d6b7a; --line:#dde3e9;
  --accent:#0b7a75; --accent-soft:#dcf1ef; --good:#1f7a3d; --bad:#b3361f; --warn:#9a6a00; --bar:#c9d3dc;
  --font: system-ui, "Segoe UI", sans-serif; --mono: ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg:#12181e; --surface:#1a232c; --fg:#e4eaf0; --muted:#93a1af; --line:#2b3844;
    --accent:#4fc4bc; --accent-soft:#19393a; --good:#6fcf8f; --bad:#f08a74; --warn:#e0b050; --bar:#3a4957; color-scheme:dark; }
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 var(--font); padding:20px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left)); }
main { max-width:1100px; margin:0 auto; display:flex; flex-direction:column; gap:16px; }
header { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:baseline; gap:4px 16px; }
h1 { font-size:22px; margin:0; } h2 { font-size:15px; margin:0 0 10px; }
.muted { color:var(--muted); font-size:13px; }
nav { display:flex; gap:4px; flex-wrap:wrap; border-bottom:1px solid var(--line); }
nav button { background:none; border:0; border-bottom:2px solid transparent; padding:8px 14px; color:var(--muted); font:inherit; cursor:pointer; }
nav button[aria-selected="true"] { color:var(--accent); border-color:var(--accent); font-weight:600; }
.panel { background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:16px; }
.grid { display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); }
.stat { font-size:28px; font-weight:600; font-variant-numeric:tabular-nums; line-height:1.1; }
.stat small { font-size:13px; font-weight:400; color:var(--muted); }
table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
th,td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:middle; }
th { font-size:12px; color:var(--muted); font-weight:600; cursor:pointer; white-space:nowrap; user-select:none; }
td.num,th.num { text-align:right; }
.scroll { overflow-x:auto; }
.bar { height:8px; background:var(--bar); border-radius:4px; min-width:80px; position:relative; overflow:hidden; }
.bar i { position:absolute; inset:0 auto 0 0; background:var(--accent); }
.bar i.low { background:var(--bad); } .bar i.mid { background:var(--warn); }
input,select,textarea,button.btn { font:inherit; color:var(--fg); background:var(--surface); border:1px solid var(--line); border-radius:5px; padding:6px 8px; }
textarea { width:100%; min-height:130px; font-family:var(--mono); font-size:12px; }
button.btn { cursor:pointer; } button.btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
button.btn.danger { color:var(--bad); }
.row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:8px 0; }
label.f { display:flex; flex-direction:column; gap:2px; font-size:12px; color:var(--muted); }
.tag { display:inline-block; padding:1px 7px; border-radius:99px; font-size:12px; background:var(--accent-soft); color:var(--accent); }
.tag.bad { background:none; color:var(--bad); border:1px solid var(--bad); } .tag.ok { color:var(--good); background:none; border:1px solid var(--good); }
.check { display:flex; gap:10px; align-items:baseline; padding:6px 0; border-bottom:1px solid var(--line); }
.check.done span.t { text-decoration:line-through; color:var(--muted); }
.check .d { margin-left:auto; font-family:var(--mono); font-size:12px; color:var(--muted); white-space:nowrap; }
[hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>ABIM Study Tracker</h1>
    <span class="muted" id="today"></span>
  </header>
  <nav role="tablist" id="tabs"></nav>

  <section id="v-dash"></section>
  <section id="v-questions" hidden></section>
  <section id="v-log" hidden></section>
  <section id="v-plan" hidden></section>
</main>

<script>
"use strict";
// ---- state ---------------------------------------------------------------
const KEY = "abim-tracker-v1";
const DEFAULT = {
  questions: [],           // {src,qid,date,system,topic,subject,result,time}
  examDate: "2027-08-12",
  poolSize: "",            // total QBank questions, user-set
  checks: {},
  extraSystems: []
};
let S;   // initialised after PLAN is defined (see below)
function load() {
  try { return sanitize(JSON.parse(localStorage.getItem(KEY))); } catch (e) { return structuredClone(DEFAULT); }
}
// Whitelist-copy untrusted JSON (import or localStorage) into the known schema.
function sanitize(d) {
  if (!d || typeof d !== "object" || !Array.isArray(d.questions)) throw new Error("bad schema");
  const str = v => typeof v === "string" ? v : "";
  const out = structuredClone(DEFAULT);
  out.questions = d.questions.filter(q => q && typeof q === "object").map(q => ({
    src: str(q.src), qid: str(q.qid), date: /^\d{4}-\d{2}-\d{2}$/.test(q.date) ? q.date : "1970-01-01",
    system: str(q.system), topic: str(q.topic), subject: str(q.subject),
    result: ["correct", "incorrect", "omitted"].includes(q.result) ? q.result : "omitted",
    time: Number.isFinite(q.time) ? q.time : 0 }));
  if (/^\d{4}-\d{2}-\d{2}$/.test(d.examDate)) out.examDate = d.examDate;
  out.poolSize = Number.isFinite(+d.poolSize) && d.poolSize !== "" ? String(+d.poolSize) : "";
  if (d.checks && typeof d.checks === "object") for (const p of PLAN) if (d.checks[p.id] === true) out.checks[p.id] = true;
  if (Array.isArray(d.extraSystems)) out.extraSystems = d.extraSystems.filter(s => typeof s === "string");
  return out;
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const iso = d => d.toISOString().slice(0, 10);
const TODAY = new Date(); TODAY.setHours(0,0,0,0);
const todayIso = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const daysTo = s => Math.round((new Date(s + "T00:00:00") - TODAY) / 864e5);
const pct = (a, b) => b ? Math.round(1000 * a / b) / 10 : null;

// ---- plan data (from docs/abim-2027-plan.md) -----------------------------
const PLAN = [
  { id:"reg-open",  t:"Registration opens (ABIM Physician Portal)", d:"2026-12-01" },
  { id:"sa",        t:"Buy UWorld self-assessments (3 forms) – $120", d:"2027-03-01" },
  { id:"reg-close", t:"Register by standard deadline (avoids $400 late fee)", d:"2027-04-15" },
  { id:"late",      t:"Late registration closes", d:"2027-04-28" },
  { id:"pearson",   t:"Schedule seat on Pearson VUE (first-come)", d:"2027-04-15" },
  { id:"exam",      t:"IM exam window opens (08-12, 08-16, 08-17, 08-25, 08-26)", d:"2027-08-12" },
  { id:"uw-exp",    t:"UWorld QBank expires (one-time reset available)", d:"2027-10-22" },
  { id:"mksap-exp", t:"MKSAP subscription expires", d:"2028-02-02" },
];
const SYSTEMS_HINT = ["Cardiovascular System","Pulmonary & Critical Care","Infectious Diseases","Gastrointestinal & Nutrition",
  "Renal, Urinary Systems & Electrolytes","Endocrine, Diabetes & Metabolism","Rheumatology/Orthopedics & Sports","Nervous System",
  "Dermatology","Psychiatric/Behavioral & Substance Use Disorder","Biostatistics & Epidemiology","Ophthalmology",
  "Ear, Nose & Throat (ENT)","Female Reproductive System & Breast"];

S = load();

// ---- stats ---------------------------------------------------------------
function wilson(k, n) {            // 95% interval for accuracy
  if (!n) return [0, 1];
  const z = 1.96, p = k / n, d = 1 + z*z/n, c = p + z*z/(2*n), m = z*Math.sqrt(p*(1-p)/n + z*z/(4*n*n));
  return [(c - m) / d, (c + m) / d];
}
const answered = q => q.result !== "omitted";
function group(qs, key) {
  const g = new Map();
  for (const q of qs) {
    const k = q[key] || "(none)";
    const r = g.get(k) || { k, n:0, c:0, omit:0, time:0, tn:0 };
    if (answered(q)) { r.n++; if (q.result === "correct") r.c++; } else r.omit++;
    if (q.time > 0) { r.time += q.time; r.tn++; }
    g.set(k, r);
  }
  return [...g.values()].map(r => ({ ...r, acc: pct(r.c, r.n), ci: wilson(r.c, r.n) }));
}
const barCls = a => a == null ? "" : a < 55 ? "low" : a < 70 ? "mid" : "";
const bar = a => `<div class="bar"><i class="${barCls(a)}" style="width:${a ?? 0}%"></i></div>`;

// ---- CSV import ----------------------------------------------------------
function parseCSV(text) {
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i+1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === ",") { row.push(cur); cur = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i+1] === "\n") i++; row.push(cur); rows.push(row); row = []; cur = ""; }
    else cur += ch;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim()));
}
const normResult = v => {
  v = String(v).trim().toLowerCase();
  if (/^(correct|right|true|1|c)$/.test(v)) return "correct";
  if (/^(incorrect|wrong|false|0|i|w)$/.test(v)) return "incorrect";
  if (/^(omitted|unanswered|skipped|o)$/.test(v)) return "omitted";
  return null;
};
function importCSV(text, src, date) {
  const rows = parseCSV(text);
  if (rows.length < 2) throw new Error("Need a header row and at least one data row.");
  const head = rows[0].map(h => h.trim().toLowerCase()), body = rows.slice(1);
  const col = test => head.findIndex(test);
  let ri = col(h => h === "result" || h === "status");
  if (ri < 0) ri = head.findIndex((h, i) => body.every(r => normResult(r[i] ?? "") !== null));
  if (ri < 0) throw new Error("Couldn't find a Correct/Incorrect result column.");
  const ix = {
    qid: col(h => h === "question_id" || h === "id"), num: col(h => h === "question_num"),
    system: col(h => h.includes("system")), topic: col(h => h.includes("topic")),
    subject: col(h => h.includes("subject")),
    time: col(h => /^(time|time_spent|your_time)/.test(h) || (h.includes("time") && !h.includes("avg") && !h.includes("average")))
  };
  const have = new Set(S.questions.map(q => q.src + "|" + q.qid + "|" + q.date));
  let added = 0, dup = 0;
  body.forEach((r, i) => {
    const result = normResult(r[ri] ?? ""); if (!result) return;
    const qid = (ix.qid >= 0 ? r[ix.qid] : "") || (ix.num >= 0 ? "n" + r[ix.num] : "") || `row${Date.now()}-${i}`;
    const key = src + "|" + qid + "|" + date;
    if (have.has(key)) { dup++; return; }
    have.add(key);
    const t = ix.time >= 0 ? parseFloat(r[ix.time]) : NaN;
    S.questions.push({ src, qid, date, result,
      system: ix.system >= 0 ? r[ix.system].trim() : "", topic: ix.topic >= 0 ? r[ix.topic].trim() : "",
      subject: ix.subject >= 0 ? r[ix.subject].trim() : "", time: isNaN(t) ? 0 : t });
    added++;
  });
  save();
  return { added, dup };
}

// ---- views ---------------------------------------------------------------
const TABS = [["dash","Dashboard"],["questions","Questions"],["log","Log / Import"],["plan","Plan"]];
let tab = "dash";
function renderTabs() {
  $("#tabs").innerHTML = TABS.map(([k, l]) => `<button role="tab" data-k="${k}" aria-selected="${k === tab}">${l}</button>`).join("");
  for (const [k] of TABS) $("#v-" + k).hidden = k !== tab;
}
$("#tabs").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  tab = b.dataset.k; renderTabs(); render();
});

function renderDash() {
  const qs = S.questions, a = qs.filter(answered), c = a.filter(q => q.result === "correct").length;
  const acc = pct(c, a.length), [lo, hi] = wilson(c, a.length);
  const dExam = daysTo(S.examDate), dExp = daysTo("2027-10-22");
  const done = new Set(qs.filter(q => q.src === "UWorld").map(q => q.qid)).size;
  const pool = parseInt(S.poolSize) || 0, left = pool ? Math.max(pool - done, 0) : null;
  const perDay = left != null && dExam > 0 ? Math.ceil(left / dExam) : null;
  const last7 = qs.filter(q => daysTo(q.date) >= -6).length;
  const sys = group(qs, "system").filter(r => r.k !== "(none)").sort((x, y) => (x.acc ?? 101) - (y.acc ?? 101));
  const weak = group(qs, "topic").filter(r => r.n >= 2 && r.k !== "(none)" && r.c < r.n)
    .sort((x, y) => x.ci[1] - y.ci[1]).slice(0, 10);
  const seen = new Set(sys.map(r => r.k));
  const untouched = [...SYSTEMS_HINT, ...S.extraSystems].filter(s => !seen.has(s));

  // daily volume, last 14 days
  const days = Array.from({ length: 14 }, (_, i) => { const d = new Date(TODAY); d.setDate(d.getDate() - 13 + i); return iso(new Date(d.getTime() - d.getTimezoneOffset()*6e4)); });
  const vol = days.map(d => qs.filter(q => q.date === d).length), vmax = Math.max(1, ...vol);

  $("#v-dash").innerHTML = `
  <div class="grid">
    <div class="panel"><h2>Exam countdown</h2><div class="stat">${dExam > 0 ? dExam : 0}<small> days to ${esc(S.examDate)}</small></div>
      <p class="muted">${dExp} days until QBank expires (2027-10-22)</p></div>
    <div class="panel"><h2>Overall accuracy</h2><div class="stat">${acc ?? "—"}${acc != null ? "%" : ""}<small> ${c}/${a.length}</small></div>
      <p class="muted">${a.length ? `95% CI ${(lo*100).toFixed(0)}–${(hi*100).toFixed(0)}%` : "No questions logged yet"} · ${last7} in last 7 days</p></div>
    <div class="panel"><h2>Pace</h2><div class="stat">${perDay ?? "—"}<small> Q/day needed</small></div>
      <p class="muted">${pool ? `${done} UWorld done · ${left} left of ${pool}` : "Set QBank pool size in Log / Import"}</p></div>
  </div>
  <div class="panel"><h2>Questions per day (14 d)</h2>
    <svg viewBox="0 0 280 60" width="100%" height="70" role="img" aria-label="Questions per day, last 14 days">
      ${vol.map((v, i) => `<rect x="${i*20+2}" y="${55 - v/vmax*50}" width="16" height="${v/vmax*50}" rx="2" fill="var(--accent)"><title>${days[i]}: ${v}</title></rect>`).join("")}
      <line x1="0" y1="55" x2="280" y2="55" stroke="var(--line)"/></svg></div>
  <div class="grid">
    <div class="panel"><h2>By system (weakest first)</h2>${sys.length ? `<div class="scroll"><table>
      <tr><th>System</th><th class="num">n</th><th class="num">%</th><th></th></tr>
      ${sys.map(r => `<tr><td>${esc(r.k)}</td><td class="num">${r.n}</td><td class="num">${r.acc ?? "—"}</td><td>${bar(r.acc)}</td></tr>`).join("")}
      </table></div>` : `<p class="muted">Import results to see systems.</p>`}
      ${untouched.length && qs.length ? `<p class="muted">Not yet seen: ${untouched.map(esc).join("; ")}</p>` : ""}</div>
    <div class="panel"><h2>Priority topics</h2><p class="muted">Ranked by upper bound of 95% CI on accuracy (n ≥ 2, at least one miss).</p>
      ${weak.length ? `<table><tr><th>Topic</th><th class="num">n</th><th class="num">%</th></tr>
      ${weak.map(r => `<tr><td>${esc(r.k)}</td><td class="num">${r.n}</td><td class="num">${r.acc}</td></tr>`).join("")}</table>` : `<p class="muted">Not enough data yet.</p>`}</div>
  </div>`;
}

let qSort = { k:"date", d:-1 }, qFilter = { q:"", res:"", sys:"" };
function renderQuestions() {
  const el = $("#v-questions");
  const systems = [...new Set(S.questions.map(q => q.system).filter(Boolean))].sort();
  let rows = S.questions.map((q, i) => ({ ...q, i }));
  const f = qFilter, needle = f.q.toLowerCase();
  rows = rows.filter(q => (!f.res || q.result === f.res) && (!f.sys || q.system === f.sys) &&
    (!needle || [q.topic, q.system, q.subject, q.qid, q.src].join(" ").toLowerCase().includes(needle)));
  rows.sort((x, y) => { const a = x[qSort.k], b = y[qSort.k]; return (a > b ? 1 : a < b ? -1 : 0) * qSort.d; });
  const cols = [["date","Date"],["src","Source"],["qid","ID"],["system","System"],["topic","Topic"],["subject","Subject"],["result","Result"],["time","Time (s)"]];
  el.innerHTML = `<div class="panel">
    <div class="row">
      <input id="qs" placeholder="Search topic, system, ID…" value="${esc(f.q)}" style="flex:1;min-width:200px">
      <select id="qr"><option value="">All results</option>${["correct","incorrect","omitted"].map(r => `<option ${f.res===r?"selected":""}>${r}</option>`).join("")}</select>
      <select id="qy"><option value="">All systems</option>${systems.map(s => `<option ${f.sys===s?"selected":""}>${esc(s)}</option>`).join("")}</select>
      <span class="muted">${rows.length} of ${S.questions.length}</span>
    </div>
    <div class="scroll"><table><tr>${cols.map(([k, l]) => `<th data-k="${k}">${l}${qSort.k===k ? (qSort.d>0?" ▲":" ▼") : ""}</th>`).join("")}<th></th></tr>
    ${rows.slice(0, 500).map(q => `<tr><td>${esc(q.date)}</td><td>${esc(q.src)}</td><td>${esc(q.qid)}</td><td>${esc(q.system)}</td><td>${esc(q.topic)}</td><td>${esc(q.subject)}</td>
      <td><span class="tag ${q.result==="correct"?"ok":q.result==="incorrect"?"bad":""}">${esc(q.result)}</span></td><td class="num">${esc(q.time || "")}</td>
      <td><button class="btn danger" data-del="${q.i}" title="Delete">×</button></td></tr>`).join("") || `<tr><td colspan="9" class="muted">No questions.</td></tr>`}
    </table></div>${rows.length > 500 ? `<p class="muted">Showing first 500.</p>` : ""}</div>`;
  const rerender = () => { renderQuestions(); const s = $("#qs"); s.focus(); s.setSelectionRange(s.value.length, s.value.length); };
  $("#qs").oninput = e => { qFilter.q = e.target.value; rerender(); };
  $("#qr").onchange = e => { qFilter.res = e.target.value; renderQuestions(); };
  $("#qy").onchange = e => { qFilter.sys = e.target.value; renderQuestions(); };
  el.querySelectorAll("th[data-k]").forEach(th => th.onclick = () => {
    qSort = { k: th.dataset.k, d: qSort.k === th.dataset.k ? -qSort.d : 1 }; renderQuestions(); });
  el.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { S.questions.splice(+b.dataset.del, 1); save(); renderQuestions(); });
}

function renderLog() {
  const el = $("#v-log");
  el.innerHTML = `
  <div class="panel"><h2>Import results CSV</h2>
    <p class="muted">Paste output of <code>scripts/uworld_results_table.js</code> (run on a UWorld results page), or any CSV with a Correct/Incorrect column plus optional system, topic, subject, time columns.</p>
    <div class="row">
      <label class="f">Source<select id="isrc"><option>UWorld</option><option>MKSAP</option><option>Self-assessment</option></select></label>
      <label class="f">Date<input type="date" id="idate" value="${todayIso()}"></label>
      <label class="f">Load file<input type="file" id="ifile" accept=".csv,text/csv,text/plain"></label>
    </div>
    <textarea id="icsv" placeholder="question_num,question_id,result,..."></textarea>
    <div class="row"><button class="btn primary" id="iimp">Import</button><span id="imsg" class="muted"></span></div></div>

  <div class="panel"><h2>Quick add</h2><div class="row">
    <label class="f">Source<select id="qsrc"><option>UWorld</option><option>MKSAP</option><option>Self-assessment</option></select></label>
    <label class="f">System<input id="qsys" list="syslist" style="min-width:220px"></label>
    <datalist id="syslist">${[...SYSTEMS_HINT, ...S.extraSystems].map(s => `<option value="${esc(s)}">`).join("")}</datalist>
    <label class="f">Topic<input id="qtop"></label>
    <label class="f">Result<select id="qres"><option>correct</option><option>incorrect</option><option>omitted</option></select></label>
    <button class="btn primary" id="qadd" style="align-self:end">Add</button></div></div>

  <div class="panel"><h2>Settings &amp; data</h2><div class="row">
    <label class="f">Exam date<select id="sexam">${["2027-08-12","2027-08-16","2027-08-17","2027-08-25","2027-08-26"].map(d => `<option ${d===S.examDate?"selected":""}>${d}</option>`).join("")}</select></label>
    <label class="f">QBank pool size<input id="spool" type="number" min="0" value="${esc(S.poolSize)}" placeholder="e.g. total Qs" style="width:140px"></label>
    <button class="btn" id="sexp" style="align-self:end">Export JSON</button>
    <label class="f">Import JSON<input type="file" id="simp" accept=".json,application/json"></label>
    <button class="btn danger" id="sclr" style="align-self:end">Clear all</button></div>
    <p class="muted">Data stays in this browser (localStorage). Export regularly to back up.</p></div>`;

  const msg = t => { $("#imsg").textContent = t; };
  $("#ifile").onchange = async e => { const f = e.target.files[0]; if (f) $("#icsv").value = await f.text(); };
  $("#iimp").onclick = () => {
    try { const r = importCSV($("#icsv").value, $("#isrc").value, $("#idate").value || todayIso());
      msg(`Added ${r.added}, skipped ${r.dup} duplicates.`); $("#icsv").value = ""; }
    catch (err) { msg(err.message); }
  };
  $("#qadd").onclick = () => {
    const system = $("#qsys").value.trim();
    S.questions.push({ src:$("#qsrc").value, qid:"m" + Date.now(), date:todayIso(), system, topic:$("#qtop").value.trim(), subject:"", result:$("#qres").value, time:0 });
    if (system && !SYSTEMS_HINT.includes(system) && !S.extraSystems.includes(system)) S.extraSystems.push(system);
    save(); $("#qtop").value = ""; msg(""); $("#qtop").focus();
  };
  $("#sexam").onchange = e => { S.examDate = e.target.value; save(); };
  $("#spool").onchange = e => { S.poolSize = e.target.value; save(); };
  $("#sexp").onclick = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], { type:"application/json" }));
    a.download = `abim-tracker-${todayIso()}.json`; a.click(); URL.revokeObjectURL(a.href);
  };
  $("#simp").onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try { S = sanitize(JSON.parse(await f.text())); save(); render(); } catch { alert("Not a valid tracker JSON file."); }
  };
  $("#sclr").onclick = () => { if (confirm("Delete all logged data?")) { S = structuredClone(DEFAULT); save(); render(); } };
}

function renderPlan() {
  const rows = [...PLAN].sort((a, b) => a.d.localeCompare(b.d));
  $("#v-plan").innerHTML = `<div class="panel"><h2>Milestones</h2>
    ${rows.map(p => { const n = daysTo(p.d), on = !!S.checks[p.id];
      return `<label class="check ${on ? "done" : ""}"><input type="checkbox" data-id="${p.id}" ${on ? "checked" : ""}>
        <span class="t">${esc(p.t)}</span><span class="d">${p.d} · ${n < 0 ? Math.abs(n) + " d ago" : n + " d"}</span></label>`; }).join("")}
    </div>
    <div class="panel"><h2>Budget</h2><table>
      <tr><td>ABIM IM exam fee (2026 price)</td><td class="num">$1,430</td></tr>
      <tr><td>UWorld ABIM QBank (paid)</td><td class="num">$599</td></tr>
      <tr><td>UWorld self-assessments ×3</td><td class="num">$120</td></tr>
      <tr><td>ACP MKSAP (owned)</td><td class="num">$0</td></tr>
      <tr><th>Total</th><th class="num">$2,149</th></tr></table>
      <p class="muted">Source: docs/abim-2027-plan.md. Avoid $400 late fee by registering by 2027-04-15.</p></div>`;
  $("#v-plan").querySelectorAll("input[data-id]").forEach(i => i.onchange = () => { S.checks[i.dataset.id] = i.checked; save(); renderPlan(); });
}

function render() {
  if (tab === "dash") renderDash();
  if (tab === "questions") renderQuestions();
  if (tab === "log") renderLog();
  if (tab === "plan") renderPlan();
}
$("#today").textContent = TODAY.toDateString();
renderTabs(); render();
</script>
</body>
</html>
